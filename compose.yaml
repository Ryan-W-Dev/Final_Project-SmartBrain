services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartbrain
      POSTGRES_PASSWORD: smartbrain
      POSTGRES_USER: smartbrain
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartbrain -d smartbrain']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - smartbrain_postgres_data:/var/lib/postgresql/data

volumes:
  smartbrain_postgres_data:
